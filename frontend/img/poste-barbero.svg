<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 200" fill="none">
  <defs>
    <!-- Gradiente dorado metálico para las tapas y remates -->
    <linearGradient id="oro-metalico" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8C6E2E"/>
      <stop offset="25%" stop-color="#E8C779"/>
      <stop offset="50%" stop-color="#FFF0B8"/>
      <stop offset="75%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#73551E"/>
    </linearGradient>

    <!-- Gradiente de sombra/brillo para el vidrio -->
    <linearGradient id="brillo-vidrio" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="20%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="70%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="90%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </linearGradient>

    <!-- Clip path para el cilindro central -->
    <clipPath id="cilindro-clip">
      <rect x="22" y="44" width="56" height="112" rx="4" ry="4"/>
    </clipPath>
  </defs>

  <!-- Remate esférico superior -->
  <circle cx="50" cy="14" r="6" fill="url(#oro-metalico)"/>
  <ellipse cx="50" cy="19" rx="4" ry="2" fill="#73551E"/>

  <!-- Cúpula superior dorada -->
  <path d="M26 40 C26 22, 74 22, 74 40 Z" fill="url(#oro-metalico)"/>
  <ellipse cx="50" cy="40" rx="28" ry="5" fill="url(#oro-metalico)"/>
  <rect x="20" y="38" width="60" height="6" rx="3" fill="url(#oro-metalico)"/>

  <!-- Cilindro giratorio rayado (Rojo, Blanco, Azul) -->
  <g clip-path="url(#cilindro-clip)">
    <!-- Fondo blanco del cilindro -->
    <rect x="20" y="40" width="60" height="120" fill="#FFFFFF"/>
    
    <!-- Rayas diagonales rojas y azules -->
    <!-- Franja 1 -->
    <path d="M10 30 L90 -20 L90 5 L10 55 Z" fill="#DC2626"/>
    <path d="M10 55 L90 5 L90 30 L10 80 Z" fill="#1D4ED8"/>
    
    <!-- Franja 2 -->
    <path d="M10 80 L90 30 L90 55 L10 105 Z" fill="#DC2626"/>
    <path d="M10 105 L90 55 L90 80 L10 130 Z" fill="#1D4ED8"/>
    
    <!-- Franja 3 -->
    <path d="M10 130 L90 80 L90 105 L10 155 Z" fill="#DC2626"/>
    <path d="M10 155 L90 105 L90 130 L10 180 Z" fill="#1D4ED8"/>

    <!-- Franja 4 -->
    <path d="M10 180 L90 130 L90 155 L10 205 Z" fill="#DC2626"/>
    <path d="M10 205 L90 155 L90 180 L10 230 Z" fill="#1D4ED8"/>

    <!-- Brillo cilíndrico sobre el vidrio -->
    <rect x="22" y="44" width="56" height="112" fill="url(#brillo-vidrio)"/>
  </g>

  <!-- Barras / soportes laterales de vidrio -->
  <line x1="22" y1="44" x2="22" y2="156" stroke="url(#oro-metalico)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="78" y1="44" x2="78" y2="156" stroke="url(#oro-metalico)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Anillo y base inferior dorada -->
  <rect x="20" y="154" width="60" height="6" rx="3" fill="url(#oro-metalico)"/>
  <ellipse cx="50" cy="160" rx="28" ry="5" fill="url(#oro-metalico)"/>
  <path d="M26 160 C26 182, 74 182, 74 160 Z" fill="url(#oro-metalico)"/>

  <!-- Remate inferior -->
  <ellipse cx="50" cy="180" rx="4" ry="2" fill="#73551E"/>
  <circle cx="50" cy="186" r="5" fill="url(#oro-metalico)"/>
</svg>
